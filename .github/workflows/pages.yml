name: Deploy site/ to GitHub Pages

on:
  push:
    branches:
      - live
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Safety: only deploy Pages from the default branch.
    if: github.ref == 'refs/heads/live'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Inject PUBLIC_TILES_URL config
        run: |
          echo "window.PUBLIC_TILES_URL = '${{ secrets.PUBLIC_TILES_URL }}';" > site/config.js

      - name: Inject CENSUS_API_KEY config
        run: |
          echo "window.CENSUS_API_KEY = '${{ secrets.RCPCH_CENSUS_PLATFORM_GITHUB_PAGES_API_KEY }}';" >> site/config.js

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact (site/)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
