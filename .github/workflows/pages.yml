name: Deploy site/ to GitHub Pages

on:
  push:
    branches:
      - live
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Safety: only deploy Pages from the default branch.
    if: github.ref == 'refs/heads/live'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Inject PUBLIC_TILES_URL config
        run: |
          echo "window.PUBLIC_TILES_URL = '${{ secrets.PUBLIC_TILES_URL }}';" > site/config.js

      - name: Inject CENSUS_API_KEY config
        run: |
          echo "window.CENSUS_API_KEY = '${{ secrets.RCPCH_CENSUS_PLATFORM_GITHUB_PAGES_API_KEY }}';" >> site/config.js

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact (site/)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
