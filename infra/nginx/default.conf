server {
  listen 80;

  # Tile endpoint WITH /tiles/ prefix
  location /tiles/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # Strip /tiles/ prefix before passing to pg_tileserv
    rewrite ^/tiles/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:7800;
    
    # Fix URLs in JSON responses - this is the critical part
    sub_filter_types application/json;
    sub_filter_once off;
    sub_filter '"tileurl":"https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/' '"tileurl":"https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/tiles/';
    sub_filter 'href="/' 'href="/tiles/';

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # Important: disable compression so sub_filter works
    proxy_set_header Accept-Encoding "";
  }

  # Everything else -> Django
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}