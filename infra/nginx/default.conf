server {
  listen 80;

  # Tile endpoint WITH /tiles/ prefix
  location /tiles/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # Preserve the /tiles/ prefix when proxying to the upstream so the backend
    # sees the same request path. Do NOT rewrite/strip the prefix here.
    proxy_pass http://127.0.0.1:7800;

    # Inform the backend of the public prefix in case it needs to reconstruct
    # absolute URLs (works with backends that honour X-Forwarded-Prefix).
    proxy_set_header X-Forwarded-Prefix /tiles;

    # Ensure response bodies are not compressed so sub_filter can rewrite them.
    proxy_set_header Accept-Encoding "";

    # Fix relative URLs in responses (keeps existing behaviour)
    sub_filter_types application/json text/html;
    sub_filter '"tileurl":"/' '"tileurl":"/tiles/';
    sub_filter 'href="/' 'href="/tiles/';
    sub_filter_once off;

    # Rewrite absolute FQDN root -> FQDN/tiles/ for JSON responses so any
    # absolute URLs emitted by pg_tileserv without the prefix get corrected.
    sub_filter "https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/" "https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/tiles/";
    sub_filter "http://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/" "https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/tiles/";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }


  # Everything else -> Django
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}