server {
  listen 80;

  # Tile endpoint WITH /tiles/ prefix
  location /tiles/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # Strip /tiles/ prefix before passing to pg_tileserv
    rewrite ^/tiles/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:7800;
    
    # Fix URLs in responses - catch multiple patterns
    sub_filter_types application/json text/html;
    sub_filter_once off;
    
    # Pattern 1: Full URL with domain
    sub_filter '"tileurl":"https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/' '"tileurl":"https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/tiles/';
    
    # Pattern 2: Relative URLs starting with /public.
    sub_filter '"tileurl":"/public.' '"tileurl":"/tiles/public.';
    
    # Pattern 3: URLs in index.json (might be in "url" field)
    sub_filter '"/public.' '"/tiles/public.';

    # Pattern 4: HTML hrefs
    sub_filter 'href="/public.' 'href="/tiles/public.';

    # Pattern 5: HTML hrefs WITHOUT leading slash (for index page links)
    sub_filter 'href="public.' 'href="/tiles/public.';

    # Pattern 6: General href catch-all
    sub_filter 'href="/' 'href="/tiles/';

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # Important: disable compression so sub_filter works
    proxy_set_header Accept-Encoding "";
  }

  # Everything else -> Django
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}