server {
  listen 80;

  # Tile endpoint (pg_tileserv) via /tiles/*
  location /tiles/ {
    # CORS for GitHub Pages demos and other clients
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    # Cache hints for CDN (purge when you rebuild tiles)
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    proxy_pass http://127.0.0.1:7800;

    # Fix links in HTML pages
    sub_filter 'href="/' 'href="/tiles/';
    sub_filter 'src="/' 'src="/tiles/';
    sub_filter_once off;
    sub_filter_types text/html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Everything else -> Django
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}