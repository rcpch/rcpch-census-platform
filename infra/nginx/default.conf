server {
  listen 80;

  # Tile endpoint WITH /tiles/ prefix
  location /tiles/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # Strip /tiles/ prefix before passing to pg_tileserv
    rewrite ^/tiles/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:7800;
    
    # Fix ALL URLs in JSON responses
    sub_filter_types application/json;
    sub_filter '"tileurl":"/' '"tileurl":"/tiles/';
    sub_filter '"url":"/' '"url":"/tiles/';
    sub_filter 'href="/' 'href="/tiles/';
    sub_filter_once off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Everything else -> Django
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}