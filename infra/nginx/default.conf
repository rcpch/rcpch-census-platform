server {
  listen 80;

  location /tiles/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    add_header Cache-Control "public, max-age=31536000, immutable" always;

    rewrite ^/tiles/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:7800;
    
    sub_filter_types application/json text/html;
    sub_filter_once off;
    
    # JSON patterns - APIM URL
    sub_filter '"tileurl":"https://api.rcpch.ac.uk/deprivation/v2/' '"tileurl":"https://api.rcpch.ac.uk/deprivation/v2/tiles/';
    sub_filter '"detailurl":"https://api.rcpch.ac.uk/deprivation/v2/' '"detailurl":"https://api.rcpch.ac.uk/deprivation/v2/tiles/';
    
    # JSON patterns - Container App URL (for direct access)
    sub_filter '"tileurl":"https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/' '"tileurl":"https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/tiles/';
    sub_filter '"detailurl":"https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/' '"detailurl":"https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/tiles/';
    
    # JSON patterns - relative URLs
    sub_filter '"tileurl":"/public.' '"tileurl":"/tiles/public.';
    sub_filter '"/public.' '"/tiles/public.';
    
    # HTML patterns - APIM URL
    sub_filter 'href="https://api.rcpch.ac.uk/deprivation/v2/public.' 'href="https://api.rcpch.ac.uk/deprivation/v2/tiles/public.';
    
    # HTML patterns - Container App URL
    sub_filter 'href="https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/public.' 'href="https://rcpch-census-platform-v2.greenrock-df7c746b.uksouth.azurecontainerapps.io/tiles/public.';
    
    # HTML patterns - relative URLs
    sub_filter 'href="public.' 'href="/tiles/public.';
    sub_filter 'href="index.json"' 'href="/tiles/index.json"';
    sub_filter 'href="/public.' 'href="/tiles/public.';

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";
  }

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}