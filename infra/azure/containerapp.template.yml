# infra/azure/containerapp.template.yml
properties:
  environmentId: __AZURE_ENVIRONMENT_ID__
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 80
      transport: auto
      allowInsecure: false
  template:
    # Required for the Web App to "talk" to the DB via Entra ID
    identity:
      type: UserAssigned
      userAssignedIdentities:
        "__IDENTITY_ID__": {}
    containers:
      - name: nginx
        image: ghcr.io/rcpch/rcpch-census-nginx:__IMAGE_TAG__
        resources:
          cpu: 0.25
          memory: 0.25Gi

      - name: web
        image: ghcr.io/rcpch/rcpch-census-web:__IMAGE_TAG__
        env:
          - name: DEBUG
            value: "False"
          - name: POSTGRES_DB_HOST
            value: "__AZURE_POSTGRES_HOST__.postgres.database.azure.com"
          - name: POSTGRES_DB_PORT
            value: "5432"
          - name: POSTGRES_DB
            value: "__DB_NAME__"
          - name: POSTGRES_USER
            value: "__MANAGED_IDENTITY_NAME__"
          - name: DJANGO_SETTINGS_MODULE
            value: "rcpch_census_platform.settings"
        resources:
          cpu: 1.0
          memory: 1.0Gi

      - name: tiles
        image: pramsey/pg_tileserv:latest
        env:
          # pg_tileserv requires a full URL. 
          # Note: pg_tileserv doesn't natively refresh tokens.
          - name: DATABASE_URL
            secretRef: postgres-tiles-connection-string
        resources:
          cpu: 0.5
          memory: 0.25Gi