# infra/azure/containerapp.template.yml
properties:
  environmentId: __AZURE_ENVIRONMENT_ID__
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8000
      transport: auto
      allowInsecure: false
    # No secrets section - secrets managed separately
  template:
    containers:
      # PostgreSQL with PostGIS - runs as sidecar
      - name: db
        image: postgis/postgis:15-3.4
        env:
          - name: POSTGRES_USER
            secretRef: postgres-db-user
          - name: POSTGRES_PASSWORD
            secretRef: postgres-db-password
          - name: POSTGRES_DB
            secretRef: postgres-db-name
          - name: DB_DUMP_VERSION
            value: "__DB_DUMP_VERSION__"
          - name: PGDATA
            value: "/var/lib/postgresql/data/pgdata"
        command:
          - /bin/bash
          - -c
          - |
            echo "=========================================="
            echo "Downloading init script..."
            echo "=========================================="
            mkdir -p /docker-entrypoint-initdb.d
            
            # Use cat with /dev/tcp for pure bash download (no external tools needed)
            # But that's tricky, so let's install wget first
            apt-get update && apt-get install -y wget && rm -rf /var/lib/apt/lists/*
            
            wget -q -O /docker-entrypoint-initdb.d/01-download-and-restore.sh \
              https://raw.githubusercontent.com/rcpch/rcpch-census-platform/shapes/init-db/01-download-and-restore.sh
            
            if [ -f /docker-entrypoint-initdb.d/01-download-and-restore.sh ]; then
              echo "✓ Init script downloaded successfully"
              chmod +x /docker-entrypoint-initdb.d/01-download-and-restore.sh
              ls -lh /docker-entrypoint-initdb.d/
            else
              echo "✗ Failed to download init script"
              exit 1
            fi
            
            echo "Starting PostgreSQL with init scripts..."
            exec docker-entrypoint.sh postgres
        resources:
          cpu: 2.0
          memory: 4Gi

      # Django Web App - pulling from GHCR
      - name: web
        image: ghcr.io/rcpch/rcpch-census-web:__IMAGE_TAG__
        env:
          - name: DJANGO_ALLOWED_HOSTS
            value: "__DJANGO_ALLOWED_HOSTS__"
          - name: DJANGO_CSRF_TRUSTED_ORIGINS
            value: "__DJANGO_CSRF_TRUSTED_ORIGINS__"
          - name: DJANGO_SECRET_KEY
            secretRef: django-secret-key
          - name: POSTGRES_DB_HOST
            value: "localhost"
          - name: POSTGRES_DB
            secretRef: postgres-db-name
          - name: POSTGRES_PASSWORD
            secretRef: postgres-db-password
          - name: POSTGRES_DB_PORT
            value: "5432"
          - name: POSTGRES_USER
            secretRef: postgres-db-user
          - name: POSTCODES_IO_API_KEY
            secretRef: postcodes-io-api-key
          - name: WAIT_FOR_POPULATION
            value: "true"
        probes:
          - type: Startup
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          - type: Liveness
            httpGet:
              path: /health/
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: /health/
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
        command:
          - gunicorn
          - rcpch_census_platform.asgi:application
          - -k
          - uvicorn.workers.UvicornWorker
          - --bind
          - 0.0.0.0:8000
        resources:
          cpu: 1.0
          memory: 2Gi

      # pg_tileserv for vector tiles
      - name: tiles
        image: pramsey/pg_tileserv:latest
        env:
          - name: DATABASE_URL
            secretRef: tiles-db-url
        resources:
          cpu: 0.5
          memory: 1Gi

    scale:
      minReplicas: 1
      maxReplicas: 1