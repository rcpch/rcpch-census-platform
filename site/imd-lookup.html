<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index of Multiple Deprivation Lookup</title>
  <link rel="icon" type="image/png" href="rcpch_logo.png">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#11a7f2',
            dark: '#0d0d58',
            accent: '#E00087'
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --p: 197 93% 51%;
      --pf: 197 93% 41%;
      --pc: 0 0% 100%;
      --a: 328 100% 46%;
      --af: 328 100% 36%;
      --ac: 0 0% 100%;
    }
    
    .subscore-card {
      background: #f9fafb;
      border-left: 3px solid #11a7f2;
    }

    .navbar {
      background-color: #0d0d58;
      height: 64px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    .navbar-title {
      color: white;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .navbar a {
      color: white;
    }

    .navbar a:hover {
      background-color: rgba(17, 167, 242, 0.2);
    }

    body {
      padding-top: 64px;
    }
  </style>
</head>
<body class="bg-white">
  <!-- Navbar -->
  <div class="navbar">
    <div class="navbar-start">
      <img src="rcpch_logo.png" alt="RCPCH Logo" class="h-10 ml-4 mr-3">
      <div class="navbar-title">UK Deprivation Viewer</div>
    </div>
    <div class="navbar-end">
      <ul class="menu menu-horizontal px-1">
        <li><a href="index.html">Map</a></li>
        <li><a href="imd-lookup.html">IMD Calculator</a></li>
        <li><a href="docs/index.html">Documentation</a></li>
        <li><a href="https://api.rcpch.ac.uk/deprivation/v2/swagger-ui/" target="_blank">API Spec</a></li>
      </ul>
    </div>
  </div>

  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="mb-8">
      <h1 class="text-4xl font-bold mb-2" style="color: #0d0d58;">Index of Multiple Deprivation Lookup</h1>
      <p class="text-gray-600">Enter a UK postcode to retrieve deprivation data</p>
    </div>

    <form id="imd-form" class="space-y-6">
      <div class="form-control w-full">
        <label class="label">
          <span class="label-text font-semibold">Country</span>
        </label>
        <select id="country" class="select select-bordered w-full" required>
          <option value="">Select a country</option>
          <option value="england">England</option>
          <option value="wales">Wales</option>
          <option value="scotland">Scotland</option>
          <option value="northern_ireland">Northern Ireland</option>
        </select>
      </div>

      <div class="form-control w-full">
        <label class="label">
          <span class="label-text font-semibold">Dataset Year</span>
        </label>
        <select id="year" class="select select-bordered w-full" required disabled>
          <option value="">Select a year</option>
        </select>
      </div>

      <div class="form-control w-full">
        <label class="label">
          <span class="label-text font-semibold">Postcode</span>
        </label>
        <input type="text" id="postcode" placeholder="e.g., SW1A 1AA" class="input input-bordered w-full" required>
      </div>

      <div class="form-control w-full">
        <label class="label">
          <span class="label-text font-semibold">Quantile (for quantile lookup)</span>
        </label>
        <select id="quantile" class="select select-bordered w-full">
          <option value="2">Median</option>
          <option value="3">Tertile</option>
          <option value="4">Quartile</option>
          <option value="5">Quintile</option>
          <option value="6">Sextile</option>
          <option value="7">Septile</option>
          <option value="8">Octile</option>
          <option value="10">Decile</option>
          <option value="12">Duodecile</option>
          <option value="16">Hexadecile</option>
          <option value="20">Vigintile</option>
        </select>
      </div>

      <div class="flex gap-4">
        <button type="submit" class="btn btn-primary flex-1" data-endpoint="quantile" style="background-color: #11a7f2; border-color: #11a7f2;">
          Get IMD Quantile
        </button>
        <button type="button" class="btn btn-outline flex-1" data-endpoint="indices" style="color: #0d0d58; border-color: #0d0d58;">
          Get Full Indices
        </button>
      </div>
    </form>

    <div id="loading" class="text-center py-8 hidden">
      <span class="loading loading-spinner loading-lg" style="color: #11a7f2;"></span>
      <p class="mt-4 text-gray-600">Loading...</p>
    </div>

    <div id="api-auth-notice" class="hidden mb-6 rounded-lg border px-4 py-3 text-sm" style="background:#fff7ed;color:#9a3412;border-color:#fdba74;"></div>

    <div id="results" class="mt-8 hidden"></div>
  </div>

  <script src="config.js?v=__ASSET_VERSION__"></script>
  <script>
    const yearsByCountry = {
      england: [2025, 2019],
      wales: [2019],
      scotland: [2020],
      northern_ireland: [2017]
    };

    const countrySelect = document.getElementById('country');
    const yearSelect = document.getElementById('year');
    const postcodeInput = document.getElementById('postcode');
    const quantileSelect = document.getElementById('quantile');
    const form = document.getElementById('imd-form');
    const resultsDiv = document.getElementById('results');
    const loadingDiv = document.getElementById('loading');
    const apiAuthNotice = document.getElementById('api-auth-notice');

    function showApiAuthNotice(message) {
      apiAuthNotice.textContent = message;
      apiAuthNotice.classList.remove('hidden');
    }

    function hideApiAuthNotice() {
      apiAuthNotice.classList.add('hidden');
      apiAuthNotice.textContent = '';
    }

    if (typeof window.CENSUS_API_KEY !== 'string' || !window.CENSUS_API_KEY) {
      console.error('[imd-lookup] Missing CENSUS_API_KEY. APIM-protected requests may be rejected.');
      showApiAuthNotice('Requests are running without an API key. If APIM subscription validation is enabled, lookups may fail.');
    }

    // Update year dropdown when country changes
    countrySelect.addEventListener('change', (e) => {
      const country = e.target.value;
      yearSelect.innerHTML = '<option value="">Select a year</option>';
      
      if (country && yearsByCountry[country]) {
        yearSelect.disabled = false;
        yearsByCountry[country].forEach(year => {
          const option = document.createElement('option');
          option.value = year;
          option.textContent = year;
          yearSelect.appendChild(option);
        });
        
        // Auto-select if only one year available
        if (yearsByCountry[country].length === 1) {
          yearSelect.value = yearsByCountry[country][0];
        }
      } else {
        yearSelect.disabled = true;
      }
    });

    // Handle both button clicks
    document.querySelectorAll('button[data-endpoint]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const endpoint = e.target.dataset.endpoint;
        await fetchIMDData(endpoint);
      });
    });

    function withApiKey(urlString) {
      const url = new URL(urlString);
      if (typeof window.CENSUS_API_KEY === 'string' && window.CENSUS_API_KEY) {
        url.searchParams.set('subscription-key', window.CENSUS_API_KEY);
      }
      return url.toString();
    }

    async function fetchIMDData(endpoint) {
      const country = countrySelect.value;
      const year = yearSelect.value;
      const postcode = postcodeInput.value.trim();
      const quantile = quantileSelect.value;

      resultsDiv.classList.add('hidden');
      loadingDiv.classList.remove('hidden');

      try {
        let url = `https://api.rcpch.ac.uk/deprivation/v2/`;
        
        if (endpoint === 'quantile') {
          url += `index_of_multiple_deprivation_quantile?postcode=${encodeURIComponent(postcode)}&country=${country}&year=${year}&quantile=${quantile}`;
        } else {
          url += `indices_of_multiple_deprivation?postcode=${encodeURIComponent(postcode)}&country=${country}&year=${year}`;
        }

        url = withApiKey(url);

        console.log('Fetching:', url);

        const response = await fetch(url);

        if (response.status === 401 || response.status === 403) {
          console.error(`[imd-lookup] API key rejected with status ${response.status}.`);
          showApiAuthNotice('The IMD API key is missing or invalid. Please check the deployed GitHub Pages secret or APIM subscription settings.');
        } else {
          hideApiAuthNotice();
        }
        
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`API returned ${response.status}: ${errorText}`);
        }

        const data = await response.json();
        displayResults(data, endpoint);
      } catch (error) {
        displayError(error.message);
      } finally {
        loadingDiv.classList.add('hidden');
      }
    }

    function displayResults(data, endpoint) {
      resultsDiv.innerHTML = '';
      
      console.log('API Response:', data);
      
      // For quantile endpoint, extract the "result" object
      let displayData = data;
      if (endpoint === 'quantile' && data.result) {
        displayData = data.result;
      }
      
      const title = document.createElement('h2');
      title.className = 'text-2xl font-bold mb-6';
      title.style.color = '#0d0d58';
      title.textContent = endpoint === 'quantile' ? 'IMD Quantile Results' : 'Full IMD Indices';
      resultsDiv.appendChild(title);

      // Create a card to display raw JSON for debugging
      const debugCard = document.createElement('details');
      debugCard.className = 'mb-6';
      debugCard.innerHTML = `
        <summary class="cursor-pointer text-sm text-gray-600 hover:text-gray-800">Show raw API response</summary>
        <pre class="mt-2 p-4 bg-gray-100 rounded text-xs overflow-auto">${JSON.stringify(data, null, 2)}</pre>
      `;
      resultsDiv.appendChild(debugCard);

      // Display all fields from the response (using displayData instead of data)
      const allFields = Object.keys(displayData);
      
      if (allFields.length > 0) {
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';
        
        allFields.forEach(field => {
          const value = displayData[field];
          if (value !== null && value !== undefined && value !== '') {
            const card = document.createElement('div');
            card.className = 'bg-base-100 border border-gray-200 rounded-lg p-4';
            
            // Handle nested objects
            let displayValue;
            if (typeof value === 'object' && !Array.isArray(value)) {
              // For objects, display as formatted JSON
              displayValue = `<pre class="text-sm overflow-auto">${JSON.stringify(value, null, 2)}</pre>`;
            } else if (Array.isArray(value)) {
              // For arrays, display as list
              displayValue = value.join(', ');
            } else {
              // For primitives, display as-is
              displayValue = value;
            }
            
            card.innerHTML = `
              <div class="text-xs font-semibold text-gray-600 mb-1">${formatFieldName(field)}</div>
              <div class="text-xl font-bold" style="color: #0d0d58;">${displayValue}</div>
            `;
            grid.appendChild(card);
          }
        });
        
        resultsDiv.appendChild(grid);
      } else {
        const emptyMsg = document.createElement('p');
        emptyMsg.className = 'text-gray-600';
        emptyMsg.textContent = 'No data returned from API';
        resultsDiv.appendChild(emptyMsg);
      }
      
      resultsDiv.classList.remove('hidden');
    }



    function displayError(message) {
      resultsDiv.innerHTML = `
        <div class="alert alert-error">
          <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          <span><strong>Error:</strong> ${message}</span>
        </div>
      `;
      resultsDiv.classList.remove('hidden');
    }

    function formatFieldName(field) {
      return field
        .split('_')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }
  </script>
</body>
</html>
