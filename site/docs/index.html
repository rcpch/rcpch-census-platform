<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCPCH Census Platform Documentation</title>
    <link rel="icon" type="image/png" href="../rcpch_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.0/github-markdown-light.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#11a7f2',
                        dark: '#0d0d58',
                        accent: '#E00087'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --p: 197 93% 51%;
            --pf: 197 93% 41%;
            --pc: 0 0% 100%;
            --a: 328 100% 46%;
            --af: 328 100% 36%;
            --ac: 0 0% 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: white;
        }
        
        .navbar {
            background-color: #0d0d58;
            height: 64px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar-title {
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .navbar a {
            color: white;
        }

        .navbar a:hover {
            background-color: rgba(17, 167, 242, 0.2);
        }
        
        .container {
            margin-top: 64px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            padding: 32px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 32px;
        }
        
        .sidebar {
            position: sticky;
            top: 96px;
            height: fit-content;
        }
        
        .nav-menu {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
        }
        
        .nav-menu h3 {
            margin: 0 0 12px 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #0d0d58;
            font-weight: 600;
        }
        
        .nav-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .nav-menu li {
            margin-bottom: 8px;
        }
        
        .nav-menu a {
            display: block;
            padding: 8px 12px;
            color: #374151;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .nav-menu a:hover {
            background: #f3f4f6;
        }
        
        .nav-menu a.active {
            background: #dbeafe;
            color: #11a7f2;
            font-weight: 500;
        }
        
        .content {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 32px;
            min-height: 500px;
        }
        
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 100%;
            color: #24292f;
            background-color: white;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            color: #0d0d58;
        }

        .markdown-body a {
            color: #11a7f2;
        }

        .markdown-body code {
            background-color: #f6f8fa;
            color: #24292f;
        }

        .markdown-body pre {
            background-color: #f6f8fa;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #6b7280;
        }
        
        .error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 4px;
            padding: 16px;
            color: #991b1b;
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 16px;
            }
            
            .sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-start">
            <img src="../rcpch_logo.png" alt="RCPCH Logo" class="h-10 ml-4 mr-3">
            <div class="navbar-title">UK Deprivation Viewer</div>
        </div>
        <div class="navbar-end">
            <ul class="menu menu-horizontal px-1">
                <li><a href="../index.html">Map</a></li>
                <li><a href="../imd-lookup.html">IMD Calculator</a></li>
                <li><a href="index.html">Documentation</a></li>
                <li><a href="https://api.rcpch.ac.uk/deprivation/v2/swagger-ui/" target="_blank">API Spec</a></li>
            </ul>
        </div>
    </div>
    
    <div class="container">
        <aside class="sidebar">
            <nav class="nav-menu">
                <h3>Documentation</h3>
                <ul id="doc-menu">
                    <li><a href="#" data-doc="boundaries.md">Boundaries</a></li>
                    <li><a href="#" data-doc="managed-database-seeding.md">Database Seeding</a></li>
                    <li><a href="#" data-doc="database-dump-and-publish.md">Dump Publication</a></li>
                    <li><a href="#" data-doc="deploy.md">Deployment Guide</a></li>
                </ul>
            </nav>
        </aside>
        
        <main class="content">
            <div id="doc-content" class="markdown-body">
                <div class="loading">
                    <span class="loading loading-spinner loading-lg" style="color: #11a7f2;"></span>
                    <p class="mt-4">Loading documentation...</p>
                </div>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script>
        const docContent = document.getElementById('doc-content');
        const menuLinks = document.querySelectorAll('[data-doc]');
        
        // Configure marked for GitHub-flavored markdown
        marked.setOptions({
            gfm: true,
            breaks: true,
            headerIds: true,
            mangle: false
        });
        
        async function loadDoc(filename) {
            try {
                docContent.innerHTML = `
                    <div class="loading">
                        <span class="loading loading-spinner loading-lg" style="color: #11a7f2;"></span>
                        <p class="mt-4">Loading...</p>
                    </div>
                `;
                
                const response = await fetch(filename);
                if (!response.ok) throw new Error(`Failed to load ${filename}`);
                
                const markdown = await response.text();
                const html = marked.parse(markdown);
                docContent.innerHTML = html;
                
                // Update active menu item
                menuLinks.forEach(link => {
                    link.classList.toggle('active', link.dataset.doc === filename);
                });
                
                // Update URL hash
                window.location.hash = filename.replace('.md', '');
                
                // Scroll to top
                window.scrollTo(0, 0);
                
            } catch (error) {
                docContent.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> Could not load ${filename}. ${error.message}
                    </div>
                `;
            }
        }
        
        // Handle menu clicks
        menuLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                loadDoc(link.dataset.doc);
            });
        });
        
        // Load doc from URL hash or default to first doc
        const initialDoc = window.location.hash 
            ? window.location.hash.substring(1) + '.md'
            : 'boundaries.md';
        
        loadDoc(initialDoc);
        
        // Handle browser back/forward
        window.addEventListener('hashchange', () => {
            const docFromHash = window.location.hash.substring(1) + '.md';
            if (docFromHash) loadDoc(docFromHash);
        });
    </script>
</body>
</html>
